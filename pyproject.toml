[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nyc-transit-ripple"
version = "0.2.0"
description = "NYC subway disruption ripple system: realtime subway ingestion, delay calculation and data quality checks (M1)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gtfs-realtime-bindings>=1.0.0",
    "protobuf>=5.26",
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=15",
    "duckdb>=1.1",
    "tzdata>=2024.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Camera counting (M3): ONNX Runtime (MIT) runs the Apache-2.0 YOLOX detector on CPU.
vision = [
    "onnxruntime>=1.17",
    "pillow>=10",
]

[project.scripts]
ripple = "transit_ripple.cli:main"
ripple-cameras = "transit_ripple.cameras.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # Camera tests decode JPEGs; the model itself is mocked, so no ONNX Runtime.
    "pillow>=10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/transit_ripple"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
