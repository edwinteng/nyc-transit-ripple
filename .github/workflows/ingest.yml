name: Ingest and analyse

# Every 5 minutes (GitHub may delay scheduled runs):
#   subway feeds (3 snapshots), service alerts, NYC DOT traffic speed and
#   Citi Bike status -> quality report -> baselines (at most daily) -> delay
#   events -> camera counts near ongoing events (capped) -> surface impact score
#   and rule-based explanations -> data branch.
# Slower cadences are handled inside the run: Citi Bike station information and
# GBFS discovery are refreshed daily, the static GTFS every 6 hours, the camera
# inventory weekly, baselines daily, and compaction/retention once the day has
# rolled over. The "Deploy dashboard" workflow runs after this one and publishes
# the dashboard to GitHub Pages.
#
# Security: read-only token by default; only this job can write, and only to the
# data branch. Third-party actions are pinned to commit SHAs. This workflow never
# runs for pull requests, so its secret is not exposed to forks.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      polls:
        description: "Subway snapshots per run"
        default: "3"
      interval:
        description: "Seconds between subway snapshots"
        default: "60"
      save_raw:
        description: "Also upload raw subway payloads as an artifact"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingest-subway
  cancel-in-progress: false

env:
  DATA_BRANCH: ${{ vars.RIPPLE_DATA_BRANCH || 'data' }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  RIPPLE_DATA_DIR: datastore
  RIPPLE_STATIC_DIR: .cache/static
  RIPPLE_MODEL_CACHE_DIR: .cache/models

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push aggregates to the data branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install (with the vision extra for event camera counts)
        run: uv sync --frozen --no-dev --extra vision

      - name: Static GTFS cache slot (refreshed every 6 hours)
        id: slot
        run: echo "slot=$(date -u +%Y%m%d)-$(( 10#$(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/static
          key: static-gtfs-v1-${{ steps.slot.outputs.slot }}
          restore-keys: static-gtfs-v1-

      # Detector weights are pinned by SHA-256 in model.py; they are downloaded only
      # the first time an event needs camera counts and are never committed.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/models
          key: camera-models-${{ hashFiles('src/transit_ripple/cameras/model.py') }}

      - name: Check out data branch
        run: scripts/data_branch.sh prepare datastore

      - name: Ingest subway, alerts, traffic speed and Citi Bike
        id: ingest
        env:
          POLLS: ${{ inputs.polls || '3' }}
          INTERVAL: ${{ inputs.interval || '60' }}
          SAVE_RAW: ${{ inputs.save_raw && '1' || '' }}
          # Optional free NYC Open Data app token (repository secret); never logged.
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: >-
          uv run --no-sync ripple ingest
          --sources subway,alerts,traffic,bikes
          --polls "$POLLS" --interval "$INTERVAL" ${SAVE_RAW:+--save-raw}
          --report-md "$RUNNER_TEMP/quality-report.md"

      - name: Baselines (recomputed at most once a day)
        run: uv run --no-sync ripple baselines

      - name: Camera inventory (weekly) and camera-station mapping
        continue-on-error: true # events still run, with camera counts skipped
        run: uv run --no-sync ripple-cameras map

      # Cameras are counted only for ongoing events, most severe first, with a hard
      # cap per run (RIPPLE_EVENT_CAMERA_MAX_PER_RUN, default 30; one request per
      # second). Set the repository variable RIPPLE_EVENT_CAMERAS_ENABLED=false to
      # turn the camera step off.
      - name: Detect events, count cameras near them, score the surface impact
        env:
          RIPPLE_EVENT_CAMERAS_ENABLED: ${{ vars.RIPPLE_EVENT_CAMERAS_ENABLED || 'true' }}
          RIPPLE_EVENT_CAMERA_MAX_PER_RUN: ${{ vars.RIPPLE_EVENT_CAMERA_MAX_PER_RUN || '30' }}
        run: uv run --no-sync ripple events

      - name: Compact previous days and apply retention
        if: always() && steps.ingest.outcome == 'success'
        run: |
          uv run --no-sync ripple compact
          uv run --no-sync ripple prune --table bike_minute

      - name: Quality report summary
        if: always()
        run: cat "$RUNNER_TEMP/quality-report.md" >> "$GITHUB_STEP_SUMMARY" || true

      # Publish whenever ingestion succeeded, so a failing analysis step never
      # loses data (the job still fails and shows the error).
      - name: Publish aggregates to data branch
        if: >-
          always() && steps.ingest.outcome == 'success'
          && github.ref_name == github.event.repository.default_branch
          && vars.RIPPLE_PUBLISH_DATA != 'false'
        run: scripts/data_branch.sh publish datastore "Ingest run ${{ github.run_id }}"

      - name: Upload per-stop delays and reports (short-term)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ingest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            datastore/stop_delays/
            datastore/reports/
            datastore/raw/
          retention-days: ${{ vars.RIPPLE_ARTIFACT_RETENTION_DAYS || 7 }}
          if-no-files-found: warn
