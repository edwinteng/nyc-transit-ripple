name: Ingest and analyse

# Scheduled every 5 minutes, but GitHub starts scheduled runs only every few hours,
# so each run keeps collecting for RIPPLE_COLLECT_MINUTES (default 330) and
# publishes after every iteration (scripts/collect.sh). Each iteration:
#   subway feeds (5 snapshots about a minute apart), bus positions (one snapshot
#   per subway poll), service alerts, NYC DOT traffic speed and Citi Bike status
#   -> quality report -> baselines (every 6 hours) -> delay events -> camera
#   counts near ongoing events (capped) -> surface impact score and rule-based
#   explanations -> ranked go / switch / wait options for riders -> data branch.
# Slower cadences are handled inside the run: Citi Bike station information and
# GBFS discovery daily, the static GTFS every 6 hours, the bus stop list and the
# camera inventory weekly, compaction and retention every hour. The "Deploy
# dashboard" workflow runs after each run ends and publishes
# the dashboard to GitHub Pages.
#
# Security: read-only token by default; only this job can write, and only to the
# data branch. Third-party actions are pinned to commit SHAs. This workflow never
# runs for pull requests, so its secret is not exposed to forks.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep collecting (minutes)"
        default: "330"
      polls:
        description: "Subway snapshots per iteration"
        default: "5"
      interval:
        description: "Seconds between subway snapshots"
        default: "60"
      save_raw:
        description: "Also upload raw subway payloads as an artifact"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingest-subway
  cancel-in-progress: false

env:
  DATA_BRANCH: ${{ vars.RIPPLE_DATA_BRANCH || 'data' }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  RIPPLE_DATA_DIR: datastore
  RIPPLE_STATIC_DIR: .cache/static
  RIPPLE_MODEL_CACHE_DIR: .cache/models

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # GitHub-hosted jobs may run at most 6 hours
    permissions:
      contents: write # push aggregates to the data branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install (with the vision extra for event camera counts)
        run: uv sync --frozen --no-dev --extra vision

      - name: Static GTFS cache slot (refreshed every 6 hours)
        id: slot
        run: echo "slot=$(date -u +%Y%m%d)-$(( 10#$(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/static
          key: static-gtfs-v1-${{ steps.slot.outputs.slot }}
          restore-keys: static-gtfs-v1-

      # Detector weights are pinned by SHA-256 in model.py; they are downloaded only
      # the first time an event needs camera counts and are never committed.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/models
          key: camera-models-${{ hashFiles('src/transit_ripple/cameras/model.py') }}

      - name: Check out data branch
        run: scripts/data_branch.sh prepare datastore

      # GitHub starts scheduled runs only every few hours, so each run collects for
      # several hours: every iteration ingests POLLS snapshots (about a minute
      # apart), updates baselines (every 6 h), detects events, counts cameras near
      # ongoing events (capped), ranks options for riders, and publishes the data
      # branch. A schedule firing during a run is queued and starts right after it.
      # Cameras: set RIPPLE_EVENT_CAMERAS_ENABLED=false (repository variable) to
      # turn them off; RIPPLE_EVENT_CAMERA_MAX_PER_RUN caps cameras per iteration.
      - name: Collect, analyse and publish (repeated)
        env:
          MINUTES: ${{ inputs.minutes || vars.RIPPLE_COLLECT_MINUTES || '330' }}
          POLLS: ${{ inputs.polls || '5' }}
          INTERVAL: ${{ inputs.interval || '60' }}
          SAVE_RAW: ${{ inputs.save_raw && '1' || '' }}
          PUBLISH: >-
            ${{ github.ref_name == github.event.repository.default_branch
            && vars.RIPPLE_PUBLISH_DATA != 'false' && '1' || '0' }}
          RIPPLE_EVENT_CAMERAS_ENABLED: ${{ vars.RIPPLE_EVENT_CAMERAS_ENABLED || 'true' }}
          RIPPLE_EVENT_CAMERA_MAX_PER_RUN: ${{ vars.RIPPLE_EVENT_CAMERA_MAX_PER_RUN || '30' }}
          # Optional free NYC Open Data app token (repository secret); never logged.
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          # Free MTA Bus Time key (repository secret). Without it, or if Bus Time
          # rejects it, bus data is reported "unavailable" and skipped.
          MTA_BUS_API_KEY: ${{ secrets.MTA_BUS_API_KEY }}
        run: scripts/collect.sh "$MINUTES"

      - name: Quality report summary (last iteration)
        if: always()
        run: cat "$RUNNER_TEMP/quality-report.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload per-stop delays and reports (short-term)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ingest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            datastore/stop_delays/
            datastore/reports/
            datastore/raw/
          retention-days: ${{ vars.RIPPLE_ARTIFACT_RETENTION_DAYS || 7 }}
          if-no-files-found: warn
